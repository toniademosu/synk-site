<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're invited to split a bill on Synk</title>
<meta name="description" content="A friend added you to a bill on Synk. Tap to see it, claim your items, and pay your share your way.">
<meta property="og:title" content="You're invited to split a bill">
<meta property="og:description" content="Tap to see the bill and your share — pay free by bank, or instantly.">
<meta property="og:image" content="https://synk.money/assets/og-card-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0C0D11">
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0D11; --hairline: rgba(255,255,255,.08);
    --text: #fff; --subtext: #9ca3af;
    --grad: linear-gradient(135deg, #f43f5e, #f97316);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px 24px;
  }
  a { text-decoration: none; color: inherit; }
  .coin { width: 96px; height: 96px; margin-bottom: 28px; animation: pop .6s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; margin-bottom: 14px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: clamp(26px, 6vw, 38px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; max-width: 520px; }
  p.sub { color: var(--subtext); font-size: 15px; line-height: 1.6; margin: 16px 0 36px; max-width: 420px; }
  .pill {
    display: inline-block; background: var(--grad); color: #fff;
    padding: 15px 40px; border-radius: 999px; font-weight: 700; font-size: 16px;
    box-shadow: 0 4px 24px rgba(244,63,94,.35);
    transition: transform .15s ease;
  }
  .pill:hover { transform: translateY(-1px); }
  .secondary { display: block; margin-top: 20px; color: var(--subtext); font-size: 14px; }
  .secondary a { color: var(--text); border-bottom: 1px solid var(--hairline); padding-bottom: 1px; }
  .secondary a:hover { color: #f97316; }
  footer { position: fixed; bottom: 20px; color: var(--subtext); font-size: 12px; }
  footer a:hover { color: #f97316; }
</style>
</head>
<body>

<img class="coin" src="/assets/logo-mark.png" alt="Synk">
<span class="eyebrow">Bill invite</span>
<h1 id="headline">You're invited to split a bill</h1>
<p class="sub" id="sub">Tap below to open Synk and add yourself — claim your items, see your fair share, and settle up your way.</p>
<div id="billCard" style="display:none; background:var(--panel,rgba(255,255,255,.04)); border:1px solid var(--hairline); border-radius:16px; padding:18px 28px; margin:0 0 32px; min-width:260px;">
  <div id="billTitle" style="font-weight:700; font-size:18px;"></div>
  <div id="billMeta" style="color:var(--subtext); font-size:14px; margin-top:6px;"></div>
</div>

<a class="pill" id="openBtn" href="#">Join in the app</a>
<span class="secondary">Don't have Synk yet? <a href="https://testflight.apple.com/join/66DujTNq">Get the app on TestFlight</a> — then tap your invite link again.</span>

<footer><a href="/">synk.money</a></footer>

<script>
  // Hand the invite token to the app. Universal links open the app directly
  // once installed; this page is the fallback (and the no-app landing).
  var params = new URLSearchParams(location.search);
  var t = (params.get('t') || '').trim();
  var deepLink = 'synk://bill-join' + (t ? ('?t=' + encodeURIComponent(t)) : '');
  var btn = document.getElementById('openBtn');
  btn.setAttribute('href', deepLink);
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (isMobile) setTimeout(function () { location.href = deepLink; }, 600);

  // Show the ACTUAL bill (title, total, who invited you) — this page is the
  // product's first impression for people without the app, so it should sell.
  // get_bill_invite_public_preview is anon-callable and token-gated; the anon
  // key below is the public client key, safe to embed.
  var SUPA = 'https://gswskgvhkfntpyjcdjtd.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdzd3NrZ3Zoa2ZudHB5amNkanRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDQ4NjMsImV4cCI6MjA5NDg4MDg2M30.sPE4jFIhd60-KhkdWV8bDdP5I4QkCSOYtE5KENx9fNI';
  if (/^[0-9a-f-]{36}$/i.test(t)) {
    fetch(SUPA + '/rest/v1/rpc/get_bill_invite_public_preview', {
      method: 'POST',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: t })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (b) {
      if (!b || !b.title) return; // unknown/deleted bill: keep the generic copy
      var esc = function (x) { return String(x); }; // textContent below — no HTML injection surface
      document.getElementById('headline').textContent = b.organizerFirst
        ? b.organizerFirst + ' invited you to split ' + esc(b.title)
        : "You're invited to split " + esc(b.title);
      var money = '';
      try {
        money = new Intl.NumberFormat(undefined, { style: 'currency', currency: b.currency || 'USD' }).format(Number(b.total || 0));
      } catch (e) { money = '$' + Number(b.total || 0).toFixed(2); }
      document.getElementById('billTitle').textContent = esc(b.title) + ' · ' + money;
      document.getElementById('billMeta').textContent =
        (b.participantCount || 1) + (b.participantCount === 1 ? ' person' : ' people') + ' on this bill — join to claim your share';
      document.getElementById('billCard').style.display = 'block';
      document.getElementById('sub').textContent = 'Open Synk to add yourself — claim your items, see your fair share, and pay your way.';
      // One link, both paths (2026-07-28): once the bill is collecting, no-app
      // recipients can pay as guests in the browser instead of dead-ending at
      // "get the app".
      if (b.poolId) {
        var g = document.createElement('a');
        g.href = 'https://synk.money/pay?pool=' + encodeURIComponent(b.poolId);
        g.style.cssText = 'display:block;margin-top:14px;color:#f97316;font-size:15px;text-decoration:underline;';
        g.textContent = 'No app? Pay as a guest in your browser →';
        document.getElementById('billCard').appendChild(g);
      }
    }).catch(function () { /* generic copy is the fallback */ });
  }
</script>

</body>
</html>
