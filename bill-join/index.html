<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>You're invited to split a bill on Synk</title>
<meta name="description" content="A friend added you to a bill on Synk. Tap to see it, claim your items, and pay your share your way.">
<meta property="og:title" content="You're invited to split a bill">
<meta property="og:description" content="Tap to see the bill and your share — pay free by bank, or instantly.">
<meta property="og:image" content="https://synk.money/assets/og-card-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta name="twitter:card" content="summary_large_image">
<meta name="theme-color" content="#0C0D11">
<link rel="icon" type="image/png" href="/assets/logo-mark.png">
<link rel="apple-touch-icon" href="/assets/icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700;800&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0C0D11; --hairline: rgba(255,255,255,.08);
    --text: #fff; --subtext: #9ca3af;
    --grad: linear-gradient(135deg, #f43f5e, #f97316);
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    background: var(--bg); color: var(--text);
    font-family: 'Sora', -apple-system, BlinkMacSystemFont, sans-serif;
    -webkit-font-smoothing: antialiased;
    min-height: 100svh; display: flex; flex-direction: column;
    align-items: center; justify-content: center; text-align: center;
    padding: 32px 24px;
  }
  a { text-decoration: none; color: inherit; }
  .coin { width: 96px; height: 96px; margin-bottom: 28px; animation: pop .6s cubic-bezier(.2,.9,.3,1.2) both; }
  @keyframes pop { from { transform: scale(.6); opacity: 0; } to { transform: none; opacity: 1; } }
  .eyebrow {
    display: inline-block; font-size: 12px; font-weight: 700; letter-spacing: .14em;
    text-transform: uppercase; margin-bottom: 14px;
    background: var(--grad); -webkit-background-clip: text; background-clip: text; color: transparent;
  }
  h1 { font-size: clamp(26px, 6vw, 38px); font-weight: 800; letter-spacing: -0.01em; line-height: 1.2; max-width: 520px; }
  p.sub { color: var(--subtext); font-size: 15px; line-height: 1.6; margin: 16px 0 36px; max-width: 420px; }
  .pill {
    display: inline-block; background: var(--grad); color: #fff;
    padding: 15px 40px; border-radius: 999px; font-weight: 700; font-size: 16px;
    box-shadow: 0 4px 24px rgba(244,63,94,.35);
    transition: transform .15s ease;
  }
  .pill:hover { transform: translateY(-1px); }
  .secondary { display: block; margin-top: 20px; color: var(--subtext); font-size: 14px; }
  .secondary a { color: var(--text); border-bottom: 1px solid var(--hairline); padding-bottom: 1px; }
  .secondary a:hover { color: #f97316; }
  footer { position: fixed; bottom: 20px; color: var(--subtext); font-size: 12px; }
  footer a:hover { color: #f97316; }
  .accept-wrap { width: 100%; max-width: 300px; margin: 4px auto 0; text-align: left; }
  .accept-cta {
    display: block; width: 100%; text-align: center; background: transparent;
    border: 1px solid var(--hairline); color: #fff; padding: 13px 20px; border-radius: 999px;
    font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer;
    transition: border-color .15s ease;
  }
  .accept-cta:hover { border-color: #f97316; }
  .accept-form { display: none; margin-top: 14px; }
  .accept-form .field { margin-bottom: 12px; }
  .accept-form label { display: block; font-size: 12px; color: var(--subtext); margin-bottom: 5px; font-weight: 600; }
  .accept-form input {
    width: 100%; background: rgba(255,255,255,.03); border: 1px solid var(--hairline); border-radius: 10px;
    padding: 11px 14px; color: #fff; font-family: inherit; font-size: 14px;
  }
  .accept-form input:focus { outline: none; border-color: #f97316; }
  .accept-submit {
    width: 100%; margin-top: 2px; background: var(--grad); color: #fff; border: none;
    padding: 13px 20px; border-radius: 999px; font-weight: 700; font-size: 15px; font-family: inherit; cursor: pointer;
  }
  .accept-submit:disabled { opacity: .6; cursor: default; }
  .accept-error { display: none; color: #f43f5e; font-size: 13px; margin-top: 10px; }
  .accept-success { font-size: 15px; line-height: 1.5; }
</style>
</head>
<body>

<img class="coin" src="/assets/logo-mark.png" alt="Synk">
<span class="eyebrow">Bill invite</span>
<h1 id="headline">You're invited to split a bill</h1>
<p class="sub" id="sub">Tap below to open Synk and add yourself — claim your items, see your fair share, and settle up your way.</p>
<div id="billCard" style="display:none; background:var(--panel,rgba(255,255,255,.04)); border:1px solid var(--hairline); border-radius:16px; padding:18px 28px; margin:0 0 32px; min-width:260px;">
  <div id="billTitle" style="font-weight:700; font-size:18px;"></div>
  <div id="billMeta" style="color:var(--subtext); font-size:14px; margin-top:6px;"></div>
  <div id="acceptWrap" class="accept-wrap" style="display:none;">
    <button type="button" id="acceptCta" class="accept-cta">I'm in — keep me posted</button>
    <form id="acceptForm" class="accept-form">
      <div class="field"><label for="acceptName">Name</label><input id="acceptName" type="text" required maxlength="40" autocomplete="name"></div>
      <div class="field"><label for="acceptEmail">Email</label><input id="acceptEmail" type="email" required autocomplete="email"></div>
      <div class="field"><label for="acceptPhone">Phone (optional)</label><input id="acceptPhone" type="tel" autocomplete="tel"></div>
      <label class="accept-consent" style="display:flex;gap:8px;align-items:flex-start;margin-top:10px;font-size:13px;color:#9ca3af;text-align:left;">
        <input type="checkbox" id="acceptSms" style="margin-top:3px;">
        <span>Text me when it's time to pay<br><span style="font-size:11px;color:#6b7280;">Msg &amp; data rates may apply. Reply STOP to opt out.</span></span>
      </label>
      <button type="submit" class="accept-submit">Count me in</button>
      <div id="acceptError" class="accept-error"></div>
    </form>
  </div>
</div>

<a class="pill" id="openBtn" href="#">Join in the app</a>
<span class="secondary">Don't have Synk yet? <a href="https://testflight.apple.com/join/66DujTNq">Get the app on TestFlight</a> — then tap your invite link again.</span>

<footer><a href="/">synk.money</a></footer>

<script>
  // Hand the invite token to the app. Universal links open the app directly
  // once installed; this page is the fallback (and the no-app landing).
  var params = new URLSearchParams(location.search);
  var t = (params.get('t') || '').trim();
  var deepLink = 'synk://bill-join' + (t ? ('?t=' + encodeURIComponent(t)) : '');
  var btn = document.getElementById('openBtn');
  btn.setAttribute('href', deepLink);
  var isMobile = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
  if (isMobile) setTimeout(function () { location.href = deepLink; }, 600);

  // Show the ACTUAL bill (title, total, who invited you) — this page is the
  // product's first impression for people without the app, so it should sell.
  // get_bill_invite_public_preview is anon-callable and token-gated; the anon
  // key below is the public client key, safe to embed.
  var SUPA = 'https://gswskgvhkfntpyjcdjtd.supabase.co';
  var ANON = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Imdzd3NrZ3Zoa2ZudHB5amNkanRkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzkzMDQ4NjMsImV4cCI6MjA5NDg4MDg2M30.sPE4jFIhd60-KhkdWV8bDdP5I4QkCSOYtE5KENx9fNI';
  if (/^[0-9a-f-]{36}$/i.test(t)) {
    fetch(SUPA + '/rest/v1/rpc/get_bill_invite_public_preview', {
      method: 'POST',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({ p_token: t })
    }).then(function (r) { return r.ok ? r.json() : null; }).then(function (b) {
      if (!b || !b.title) return; // unknown/deleted bill: keep the generic copy
      var esc = function (x) { return String(x); }; // textContent below — no HTML injection surface
      document.getElementById('headline').textContent = b.organizerFirst
        ? b.organizerFirst + ' invited you to split ' + esc(b.title)
        : "You're invited to split " + esc(b.title);
      var money = '';
      try {
        money = new Intl.NumberFormat(undefined, { style: 'currency', currency: b.currency || 'USD' }).format(Number(b.total || 0));
      } catch (e) { money = '$' + Number(b.total || 0).toFixed(2); }
      document.getElementById('billTitle').textContent = esc(b.title) + ' · ' + money;
      document.getElementById('billMeta').textContent =
        (b.participantCount || 1) + (b.participantCount === 1 ? ' person' : ' people') + ' on this bill — join to claim your share';
      document.getElementById('billCard').style.display = 'block';
      document.getElementById('sub').textContent = 'Open Synk to add yourself — claim your items, see your fair share, and pay your way.';
      // Guest accept form (2026-07-30): only for bills still open — a closed
      // (cancelled/settled) bill has nothing left to be counted in on.
      if (b.status !== 'cancelled' && b.status !== 'settled') {
        document.getElementById('acceptWrap').style.display = 'block';
      }
      // One link, both paths (2026-07-28): once the bill is collecting, no-app
      // recipients can pay as guests in the browser instead of dead-ending at
      // "get the app".
      if (b.poolId) {
        var g = document.createElement('a');
        g.href = 'https://synk.money/pay?pool=' + encodeURIComponent(b.poolId);
        g.style.cssText = 'display:block;margin-top:14px;color:#f97316;font-size:15px;text-decoration:underline;';
        g.textContent = 'No app? Pay as a guest in your browser →';
        document.getElementById('billCard').appendChild(g);
      }
    }).catch(function () { /* generic copy is the fallback */ });
  }

  // Guest accept: collapsed CTA expands to a small form that calls
  // guest_accept_bill (same Supabase project + anon key as the preview
  // fetch above). Idempotent on the server — re-submits with the same
  // email just re-confirm rather than duplicating.
  var acceptWrap = document.getElementById('acceptWrap');
  var acceptCta = document.getElementById('acceptCta');
  var acceptForm = document.getElementById('acceptForm');
  var acceptError = document.getElementById('acceptError');
  acceptCta.addEventListener('click', function () {
    acceptCta.style.display = 'none';
    acceptForm.style.display = 'block';
  });
  acceptForm.addEventListener('submit', function (e) {
    e.preventDefault();
    acceptError.style.display = 'none';
    var submitBtn = acceptForm.querySelector('.accept-submit');
    submitBtn.disabled = true;
    submitBtn.textContent = 'Counting you in…';
    fetch(SUPA + '/rest/v1/rpc/guest_accept_bill', {
      method: 'POST',
      headers: { 'apikey': ANON, 'Authorization': 'Bearer ' + ANON, 'Content-Type': 'application/json' },
      body: JSON.stringify({
        p_token: t,
        p_name: document.getElementById('acceptName').value,
        p_email: document.getElementById('acceptEmail').value,
        p_phone: document.getElementById('acceptPhone').value || null,
        p_sms_consent: document.getElementById('acceptSms').checked
      })
    }).then(function (r) { return r.json(); }).then(function (res) {
      if (res && res.ok) {
        acceptWrap.innerHTML = '';
        var done = document.createElement('div');
        done.className = 'accept-success';
        done.textContent = 'You’re on “' + res.title + '” ✓ — we’ll email you when it’s ready to pay.';
        acceptWrap.appendChild(done);
      } else {
        submitBtn.disabled = false;
        submitBtn.textContent = 'Count me in';
        acceptError.textContent = (res && res.error) || 'Something went wrong — try again.';
        acceptError.style.display = 'block';
      }
    }).catch(function () {
      submitBtn.disabled = false;
      submitBtn.textContent = 'Count me in';
      acceptError.textContent = 'Network error — try again.';
      acceptError.style.display = 'block';
    });
  });
</script>

</body>
</html>
